version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: logpulse-app
    container_name: logpulse-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - logpulse-network

  db:
    image: mysql:8.0
    container_name: logpulse-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: logpulse_ai
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - logpulse-network

networks:
  logpulse-network:
    driver: bridge